<!-- AI Chat Modal Component — persistent conversations, split-panel layout -->
<div id="aiChatModal" class="ai-chat-modal">
    <div class="ai-modal-inner">
        <!-- Sidebar: conversation list -->
        <div class="ai-modal-sidebar" id="aiModalSidebar">
            <div class="ai-sidebar-header">
                <button
                    id="aiNewChatBtn"
                    class="ai-new-chat-btn"
                    title="محادثة جديدة"
                >
                    <i class="fas fa-plus"></i> جديد
                </button>
            </div>
            <div class="ai-conv-list" id="aiConvList">
                <div
                    class="ai-conv-empty"
                    id="aiConvEmpty"
                    style="display: none"
                >
                    <i class="fas fa-comment-slash"></i><br />لا توجد محادثات
                </div>
            </div>
        </div>

        <!-- Main chat panel -->
        <div class="ai-modal-main">
            <div class="ai-chat-header">
                <div class="ai-chat-title">
                    <button
                        id="aiSidebarToggle"
                        class="ai-sidebar-toggle"
                        title="المحادثات"
                    >
                        <i class="fas fa-bars"></i>
                    </button>
                    <i class="fas fa-robot"></i>
                    <span id="aiConvTitle">مساعد الذكاء الاصطناعي</span>
                </div>
                <button id="closeAiChat" class="close-ai-chat" title="إغلاق">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="ai-chat-messages" id="aiChatMessages">
                <div class="ai-welcome-msg">
                    <div class="message-avatar">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="message-content">
                        <p>مرحباً! أنا مساعد الذكاء الاصطناعي 👋</p>
                        <p>
                            كيف يمكنني مساعدتك اليوم؟ يمكنك السؤال عن البرمجة
                            والدروس والتحديات وأي شيء آخر!
                        </p>
                    </div>
                </div>
            </div>

            <div class="ai-chat-input-area">
                <input
                    type="file"
                    id="aiFileInput"
                    accept=".txt,.js,.ts,.jsx,.tsx,.py,.java,.cpp,.c,.cs,.php,.html,.css,.json,.md,.xml,.sql,.sh,.rb,.go,.rs,.swift,.kt,.vue,.yaml,.yml,.jpg,.jpeg,.png,.gif,.webp"
                    multiple
                    style="display: none"
                />
                <div id="aiFilesContainer" class="ai-files-container"></div>
                <div style="display: flex; gap: 0.5rem; align-items: flex-end">
                    <button
                        id="aiAttachBtn"
                        class="ai-attach-btn"
                        title="إرفاق ملفات"
                    >
                        <i class="fas fa-paperclip"></i>
                    </button>
                    <textarea
                        id="aiChatInput"
                        class="ai-chat-input"
                        placeholder="اكتب رسالتك..."
                        rows="1"
                    ></textarea>
                    <button
                        id="sendAiMessage"
                        class="send-ai-btn"
                        title="إرسال"
                    >
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function () {
        const IMAGE_EXTS = ["jpg", "jpeg", "png", "gif", "webp", "bmp", "svg"];
        const TEXT_EXTS = [
            "txt",
            "md",
            "js",
            "ts",
            "py",
            "php",
            "html",
            "css",
            "json",
            "csv",
            "xml",
            "java",
            "c",
            "cpp",
            "cs",
            "go",
            "rb",
            "sh",
            "sql",
            "yaml",
            "yml",
        ];

        let conversations = [];
        let activeConvId = null;
        let isAiLoading = false;
        let aiController = null;
        let attachedFiles = [];
        let sidebarOpen = window.innerWidth > 700;

        const modal = document.getElementById("aiChatModal");
        const fab = document.getElementById("aiChatFab");
        const closeBtn = document.getElementById("closeAiChat");
        const messagesEl = document.getElementById("aiChatMessages");
        const inputEl = document.getElementById("aiChatInput");
        const sendBtn = document.getElementById("sendAiMessage");
        const convList = document.getElementById("aiConvList");
        const convEmpty = document.getElementById("aiConvEmpty");
        const convTitle = document.getElementById("aiConvTitle");
        const newChatBtn = document.getElementById("aiNewChatBtn");
        const toggleBtn = document.getElementById("aiSidebarToggle");
        const sidebar = document.getElementById("aiModalSidebar");
        const attachBtn = document.getElementById("aiAttachBtn");
        const fileInput = document.getElementById("aiFileInput");
        const filesCont = document.getElementById("aiFilesContainer");

        /* ── Sidebar toggle ── */
        sidebar.classList.toggle("collapsed", !sidebarOpen);
        toggleBtn.addEventListener("click", () => {
            sidebarOpen = !sidebarOpen;
            sidebar.classList.toggle("collapsed", !sidebarOpen);
        });

        /* ── Open / close modal ── */
        fab.addEventListener("click", () => {
            modal.style.display = "flex";
            requestAnimationFrame(() => modal.classList.add("active"));
            if (conversations.length === 0) loadConversations();
        });

        function closeModal() {
            modal.classList.remove("active");
            setTimeout(() => {
                if (!modal.classList.contains("active"))
                    modal.style.display = "none";
            }, 300);
        }

        closeBtn.addEventListener("click", closeModal);
        modal.addEventListener("click", (e) => {
            if (e.target === modal) closeModal();
        });
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && modal.classList.contains("active"))
                closeModal();
        });

        /* ── CSRF helper (Laravel Sanctum web auth) ── */
        function getCsrf() {
            const match = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]+)/);
            return match ? decodeURIComponent(match[1]) : "";
        }

        /* ── Load conversation list ── */
        function loadConversations() {
            fetch("/api/ai/conversations", {
                credentials: "include",
                headers: { Accept: "application/json" },
            })
                .then((r) => (r.ok ? r.json() : []))
                .then((data) => {
                    conversations = Array.isArray(data)
                        ? data
                        : data.conversations || data.data || [];
                    renderConvList();
                })
                .catch(() => {
                    conversations = [];
                    renderConvList();
                });
        }

        function showConvEmpty(show) {
            if (!convEmpty) return;
            convEmpty.style.display = show ? "" : "none";
        }

        /* ── Render sidebar ── */
        function renderConvList() {
            convList.innerHTML = "";
            if (conversations.length === 0) {
                const empty = document.createElement("div");
                empty.className = "ai-conv-empty";
                empty.textContent = "لا توجد محادثات بعد";
                convList.appendChild(empty);
                return;
            }
            conversations.forEach((conv) => {
                const item = document.createElement("div");
                item.className =
                    "ai-conv-item" +
                    (conv.id === activeConvId ? " active" : "");
                item.dataset.id = conv.id;

                const text = document.createElement("div");
                text.className = "ai-conv-item-text";
                text.textContent = conv.title || "محادثة جديدة";
                text.title = conv.title || "";

                const del = document.createElement("button");
                del.className = "ai-conv-item-del";
                del.innerHTML = '<i class="fas fa-trash"></i>';
                del.title = "حذف";
                del.addEventListener("click", (e) => {
                    e.stopPropagation();
                    deleteConversation(conv.id);
                });

                item.addEventListener("click", () =>
                    openConversation(conv.id, conv.title),
                );
                item.appendChild(text);
                item.appendChild(del);
                convList.appendChild(item);
            });
        }

        /* ── Reset in-flight AI state (shared helper) ── */
        function cancelInFlight() {
            if (aiController) aiController.abort();
            aiController = null;
            isAiLoading = false;
            sendBtn.classList.remove("ai-stop");
            sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
            inputEl.disabled = false;
        }

        /* ── Open a conversation ── */
        function openConversation(id, title) {
            // Synchronously cancel + restore UI — don’t wait for async finally
            cancelInFlight();
            activeConvId = id;
            convTitle.textContent = title || "مساعد الذكاء الاصطناعي";
            messagesEl.innerHTML = "";
            renderConvList();

            fetch("/api/ai/conversations/" + id, {
                credentials: "include",
                headers: { Accept: "application/json" },
            })
                .then((r) => (r.ok ? r.json() : null))
                .then((data) => {
                    if (!data) return;
                    const msgs = data.messages || [];
                    if (msgs.length === 0) showWelcome();
                    msgs.forEach((m) =>
                        appendMessage(
                            m.role === "user" ? "user" : "ai",
                            m.content,
                        ),
                    );
                    scrollDown();
                })
                .catch(() => showWelcome());
        }

        /* ── New chat ── */
        function startNewChat() {
            cancelInFlight(); // cancel any in-flight request immediately
            activeConvId = null;
            convTitle.textContent = "مساعد الذكاء الاصطناعي";
            messagesEl.innerHTML = "";
            showWelcome();
            renderConvList();
            inputEl.focus();
        }
        newChatBtn.addEventListener("click", startNewChat);

        /* ── Delete conversation ── */
        function deleteConversation(id) {
            fetch("/api/ai/conversations/" + id, {
                method: "DELETE",
                credentials: "include",
                headers: {
                    Accept: "application/json",
                    "X-XSRF-TOKEN": getCsrf(),
                },
            })
                .then((r) => {
                    if (r.ok) {
                        conversations = conversations.filter(
                            (c) => c.id !== id,
                        );
                        if (activeConvId === id) startNewChat();
                        else renderConvList();
                    }
                })
                .catch(() => {});
        }

        /* ── Welcome message ── */
        function showWelcome() {
            messagesEl.innerHTML = "";
            const wrap = document.createElement("div");
            wrap.className = "ai-welcome-msg";
            wrap.innerHTML =
                '<div class="message-avatar"><i class="fas fa-robot"></i></div>' +
                '<div class="message-content"><strong>مرحباً!</strong><p>أنا مساعدك الذكي. كيف يمكنني مساعدتك اليوم؟</p></div>';
            messagesEl.appendChild(wrap);
        }

        /* ── Markdown renderer ── */
        function renderMarkdown(text) {
            let html = "";
            const lines = text.split("\n");
            let inCode = false,
                codeLang = "",
                codeLines = [];
            let inList = false;

            function flushCode() {
                if (!codeLines.length) return "";
                const escaped = codeLines
                    .join("\n")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");
                codeLines = [];
                return (
                    '<pre><button class="ai-copy-code-btn"><i class="fas fa-copy"></i> نسخ</button><code>' +
                    escaped +
                    "</code></pre>"
                );
            }

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                if (line.startsWith("```")) {
                    if (inCode) {
                        html += flushCode();
                        inCode = false;
                        codeLang = "";
                    } else {
                        inCode = true;
                        codeLang = line.slice(3).trim();
                    }
                    continue;
                }
                if (inCode) {
                    codeLines.push(line);
                    continue;
                }

                if (inList && !line.match(/^[-*]\s/)) {
                    html += "</ul>";
                    inList = false;
                }

                let l = line
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
                    .replace(/\*(.+?)\*/g, "<em>$1</em>")
                    .replace(/`([^`]+)`/g, "<code>$1</code>");

                if (/^#{1,3}\s/.test(line)) {
                    const lvl = line.match(/^(#+)/)[1].length;
                    const txt = l.replace(/^#+\s/, "");
                    html += "<p><strong>" + txt + "</strong></p>";
                } else if (line.match(/^[-*]\s/)) {
                    if (!inList) {
                        html += "<ul>";
                        inList = true;
                    }
                    html += "<li>" + l.replace(/^[-*]\s/, "") + "</li>";
                } else if (l.trim() === "") {
                    html += "<br>";
                } else {
                    html += "<p>" + l + "</p>";
                }
            }
            if (inCode) html += flushCode();
            if (inList) html += "</ul>";
            return html;
        }

        /* ── Append a message ── */
        function appendMessage(role, content, images, codeFiles) {
            const wrap = document.createElement("div");
            wrap.className = role === "user" ? "user-message" : "ai-message";

            const avatar = document.createElement("div");
            avatar.className = "message-avatar";
            avatar.innerHTML =
                role === "user"
                    ? '<i class="fas fa-user"></i>'
                    : '<i class="fas fa-robot"></i>';

            const bubble = document.createElement("div");
            bubble.className = "message-content";

            if (images && images.length) {
                const imgWrap = document.createElement("div");
                imgWrap.className = "ai-msg-images";
                images.forEach((src) => {
                    const img = document.createElement("img");
                    img.src = src;
                    img.className = "ai-msg-thumb";
                    imgWrap.appendChild(img);
                });
                bubble.appendChild(imgWrap);
            }

            if (codeFiles && codeFiles.length) {
                const codeWrap = document.createElement("div");
                codeWrap.className = "ai-msg-code-files";
                codeFiles.forEach((name) => {
                    const badge = document.createElement("span");
                    badge.className = "ai-msg-code-badge";
                    badge.innerHTML =
                        '<i class="fas fa-file-code"></i> ' +
                        name
                            .replace(/&/g, "&amp;")
                            .replace(/</g, "&lt;")
                            .replace(/>/g, "&gt;");
                    codeWrap.appendChild(badge);
                });
                bubble.appendChild(codeWrap);
            }

            const textNode = document.createElement("div");
            textNode.innerHTML =
                role === "user"
                    ? content
                          .replace(/&/g, "&amp;")
                          .replace(/</g, "&lt;")
                          .replace(/>/g, "&gt;")
                          .replace(/\n/g, "<br>")
                    : renderMarkdown(content);
            bubble.appendChild(textNode);

            wrap.appendChild(avatar);
            wrap.appendChild(bubble);
            messagesEl.appendChild(wrap);

            /* copy buttons */
            bubble.querySelectorAll(".ai-copy-code-btn").forEach((btn) => {
                btn.addEventListener("click", () => {
                    const code = btn.nextElementSibling.textContent;
                    navigator.clipboard
                        .writeText(code)
                        .then(() => {
                            btn.innerHTML = '<i class="fas fa-check"></i> تم';
                            setTimeout(() => {
                                btn.innerHTML =
                                    '<i class="fas fa-copy"></i> نسخ';
                            }, 1500);
                        })
                        .catch(() => {});
                });
            });

            return wrap;
        }

        /* ── Typing indicator ── */
        function showTyping() {
            const wrap = document.createElement("div");
            wrap.className = "ai-message";
            wrap.id = "aiTypingIndicator";
            const avatar = document.createElement("div");
            avatar.className = "message-avatar";
            avatar.innerHTML = '<i class="fas fa-robot"></i>';
            const bubble = document.createElement("div");
            bubble.className = "message-content";
            bubble.innerHTML =
                '<div class="ai-typing-dots"><div class="ai-typing-dot"></div><div class="ai-typing-dot"></div><div class="ai-typing-dot"></div></div>';
            wrap.appendChild(avatar);
            wrap.appendChild(bubble);
            messagesEl.appendChild(wrap);
            scrollDown();
            return wrap;
        }

        function scrollDown() {
            requestAnimationFrame(() => {
                messagesEl.scrollTop = messagesEl.scrollHeight;
            });
        }

        /* ── Send message ── */
        async function sendMessage() {
            const text = inputEl.value.trim();
            const files = [...attachedFiles];
            if (!text && !files.length) return;
            if (isAiLoading) {
                if (aiController) aiController.abort();
                return;
            }

            const imgSrcs = files
                .filter(
                    (f) =>
                        f.dataUrl &&
                        IMAGE_EXTS.includes(
                            f.name.split(".").pop().toLowerCase(),
                        ),
                )
                .map((f) => f.dataUrl);
            const codeFileNames = files
                .filter((f) => f.textContent != null)
                .map((f) => f.name);
            appendMessage("user", text || "[ملف مرفق]", imgSrcs, codeFileNames);

            inputEl.value = "";
            inputEl.style.height = "";
            attachedFiles = [];
            filesCont.innerHTML = "";
            inputEl.disabled = true;

            isAiLoading = true;
            sendBtn.classList.add("ai-stop");
            sendBtn.innerHTML = '<i class="fas fa-stop"></i>';

            const typing = showTyping();
            aiController = new AbortController();

            try {
                /* Require login */
                if (!window.currentUser) {
                    typing.remove();
                    appendMessage(
                        "ai",
                        "يجب تسجيل الدخول أولاً لاستخدام المساعد الذكي.",
                    );
                    isAiLoading = false;
                    sendBtn.classList.remove("ai-stop");
                    sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
                    inputEl.disabled = false;
                    return;
                }

                /* Create conversation if none active */
                if (!activeConvId) {
                    const res = await fetch("/api/ai/conversations", {
                        method: "POST",
                        credentials: "include",
                        headers: {
                            "Content-Type": "application/json",
                            Accept: "application/json",
                            "X-XSRF-TOKEN": getCsrf(),
                        },
                        body: JSON.stringify({ title: text.slice(0, 60) }),
                        signal: aiController.signal,
                    });
                    if (!res.ok) throw new Error("conv_create");
                    const convData = await res.json();
                    const conv = convData.conversation || convData;
                    activeConvId = conv.id;
                    conversations.unshift({
                        id: conv.id,
                        title: conv.title || "محادثة جديدة",
                    });
                }

                // Capture which conversation this message belongs to.
                // If the user switches conversation while waiting, activeConvId changes
                // but we must not pollute the new conversation's view.
                const sendingConvId = activeConvId;

                /* Build form data */
                const imageFiles = files.filter(
                    (f) =>
                        IMAGE_EXTS.includes(
                            f.name.split(".").pop().toLowerCase(),
                        ) && f.dataUrl,
                );
                const textFiles = files.filter((f) => f.textContent != null);

                // Build the message text the backend will receive
                let messageText = text;
                if (
                    !messageText.trim() &&
                    imageFiles.length > 0 &&
                    textFiles.length === 0
                ) {
                    // Image-only send — give the model something to work with
                    messageText = "ما الذي تراه في هذه الصورة؟";
                } else if (!messageText.trim() && textFiles.length > 0) {
                    messageText =
                        textFiles.length === 1
                            ? `ما الذي يفعله الكود في ملف "${textFiles[0].name}"؟`
                            : "افحص هذه الملفات:";
                }

                const fd = new FormData();
                fd.append("message", messageText.trim());

                // Text file contents → 'code' field (backend accepts up to 100 000 chars)
                if (textFiles.length > 0) {
                    const codeContent = textFiles
                        .map((f) =>
                            textFiles.length > 1
                                ? `// === ${f.name} ===\n${f.textContent.slice(0, 20000)}`
                                : f.textContent.slice(0, 50000),
                        )
                        .join("\n\n");
                    fd.append("code", codeContent);
                }

                // Images → actual File objects so PHP receives them via $request->file('images')
                imageFiles.forEach((f) => {
                    fd.append("images[]", f.blob, f.name);
                });

                const msgRes = await fetch(
                    "/api/ai/conversations/" + sendingConvId + "/messages",
                    {
                        method: "POST",
                        credentials: "include",
                        headers: {
                            Accept: "application/json",
                            "X-XSRF-TOKEN": getCsrf(),
                        },
                        body: fd,
                        signal: aiController.signal,
                    },
                );

                typing.remove();

                if (msgRes.ok) {
                    const data = await msgRes.json();
                    // Always update the conversations array so the sidebar title stays correct
                    // even if the user has switched to a different conversation.
                    if (data.title) {
                        const existing = conversations.find(
                            (c) => c.id === sendingConvId,
                        );
                        if (existing) existing.title = data.title;
                    }
                    // Only update visible chat if we're still in this conversation
                    if (activeConvId === sendingConvId) {
                        appendMessage("ai", data.response || "");
                        if (data.title) {
                            convTitle.textContent = data.title;
                            renderConvList();
                        }
                    }
                } else if (activeConvId === sendingConvId) {
                    const err = await msgRes.json().catch(() => ({}));
                    appendMessage(
                        "ai",
                        err.message || err.error || "حدث خطأ. حاول مجدداً.",
                    );
                }
            } catch (err) {
                typing.remove();
                if (err.name !== "AbortError")
                    appendMessage("ai", "حدث خطأ في الاتصال. تحقق من الشبكة.");
            } finally {
                isAiLoading = false;
                aiController = null;
                sendBtn.classList.remove("ai-stop");
                sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
                inputEl.disabled = false;
                inputEl.focus();
                scrollDown();
            }
        }

        sendBtn.addEventListener("click", sendMessage);
        inputEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        inputEl.addEventListener("input", function () {
            this.style.height = "auto";
            this.style.height = Math.min(this.scrollHeight, 100) + "px";
        });

        /* ── File attach ── */
        attachBtn.addEventListener("click", () => fileInput.click());
        fileInput.addEventListener("change", () => {
            Array.from(fileInput.files).forEach((file) => {
                const ext = file.name.split(".").pop().toLowerCase();
                const isImg = IMAGE_EXTS.includes(ext);
                const isText = TEXT_EXTS.includes(ext);
                if (!isImg && !isText) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const entry = {
                        name: file.name,
                        blob: file,
                        dataUrl: isImg ? e.target.result : null,
                        textContent: isImg ? null : e.target.result,
                    };
                    attachedFiles.push(entry);

                    const badge = document.createElement("div");
                    badge.className = "ai-file-badge";
                    if (isImg) {
                        const thumb = document.createElement("img");
                        thumb.src = e.target.result;
                        thumb.className = "ai-file-thumb";
                        badge.appendChild(thumb);
                    } else {
                        const ico = document.createElement("i");
                        ico.className = "fas fa-file-code";
                        badge.appendChild(ico);
                    }
                    const nm = document.createElement("span");
                    nm.textContent = file.name;
                    const rm = document.createElement("button");
                    rm.className = "ai-remove-file-btn";
                    rm.innerHTML = '<i class="fas fa-times"></i>';
                    rm.addEventListener("click", () => {
                        attachedFiles = attachedFiles.filter(
                            (f) => f !== entry,
                        );
                        badge.remove();
                    });
                    badge.appendChild(nm);
                    badge.appendChild(rm);
                    filesCont.appendChild(badge);
                };
                if (isImg) reader.readAsDataURL(file);
                else reader.readAsText(file);
            });
            fileInput.value = "";
        });

        /* Init welcome */
        showWelcome();
    })();
</script>
