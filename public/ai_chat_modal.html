<!-- AI Chat Modal Component -->
<div id="aiChatModal" class="ai-chat-modal">
    <div class="ai-chat-container">
        <div class="ai-chat-header">
            <div class="ai-chat-title">
                <i class="fas fa-robot"></i>
                <span>مساعد الذكاء الاصطناعي</span>
            </div>
            <button id="closeAiChat" class="close-ai-chat">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="ai-chat-messages" id="aiChatMessages">
            <div class="ai-message">
                <div class="message-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="message-content">
                    <p>مرحباً! أنا مساعد الذكاء الاصطناعي 👋</p>
                    <p>
                        كيف يمكنني مساعدتك اليوم؟ يمكنك السؤال عن البرمجة
                        والدروس والتحديات وأي شيء آخر!
                    </p>
                </div>
            </div>
        </div>

        <div class="ai-chat-input-area">
            <textarea
                id="aiChatInput"
                class="ai-chat-input"
                placeholder="اكتب رسالتك هنا..."
                rows="1"
            ></textarea>
            <button id="sendAiMessage" class="send-ai-btn">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>

<style>
    /* AI Chat Modal Styles */
    .ai-chat-modal {
        position: fixed;
        bottom: 20px;
        left: 20px;
        width: 400px;
        max-height: 600px;
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(67, 97, 238, 0.3);
        display: none;
        flex-direction: column;
        z-index: 10000;
        opacity: 0;
        transform: scale(0.8);
        transition: all 0.3s ease;
    }

    .ai-chat-modal.active {
        display: flex;
        opacity: 1;
        transform: scale(1);
    }

    .ai-chat-container {
        display: flex;
        flex-direction: column;
        height: 100%;
    }

    .ai-chat-header {
        background: linear-gradient(135deg, #4361ee, #3a0ca3);
        color: white;
        padding: 1rem;
        border-radius: 15px 15px 0 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .ai-chat-title {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 600;
        font-size: 1rem;
    }

    .close-ai-chat {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        cursor: pointer;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        font-size: 1.2rem;
    }

    .close-ai-chat:hover {
        background: rgba(255, 255, 255, 0.3);
    }

    .ai-chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        background: #f8fafc;
    }

    .ai-message,
    .user-message {
        display: flex;
        gap: 0.5rem;
        animation: messageSlideIn 0.3s ease;
    }

    @keyframes messageSlideIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .user-message {
        justify-content: flex-end;
    }

    .message-avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: linear-gradient(135deg, #4361ee, #3a0ca3);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 0.9rem;
        flex-shrink: 0;
    }

    .user-message .message-avatar {
        background: linear-gradient(135deg, #4cc9f0, #4361ee);
        order: 2;
    }

    .message-content {
        max-width: 280px;
        background: white;
        padding: 0.75rem 1rem;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .user-message .message-content {
        background: linear-gradient(135deg, #4361ee, #3a0ca3);
        color: white;
    }

    .message-content p {
        margin: 0.25rem 0;
        font-size: 0.9rem;
        line-height: 1.4;
    }

    .message-content p:first-child {
        margin-top: 0;
    }

    .message-content p:last-child {
        margin-bottom: 0;
    }

    .ai-chat-input-area {
        padding: 1rem;
        border-top: 1px solid #e2e8f0;
        display: flex;
        gap: 0.5rem;
        background: white;
        border-radius: 0 0 15px 15px;
    }

    .ai-chat-input {
        flex: 1;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 0.75rem;
        font-family: inherit;
        font-size: 0.9rem;
        resize: none;
        max-height: 100px;
        transition: border-color 0.3s ease;
    }

    .ai-chat-input:focus {
        outline: none;
        border-color: #4361ee;
        box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
    }

    .send-ai-btn {
        background: linear-gradient(135deg, #4361ee, #3a0ca3);
        color: white;
        border: none;
        border-radius: 8px;
        width: 40px;
        height: 40px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        font-size: 1rem;
    }

    .send-ai-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(67, 97, 238, 0.4);
    }

    .send-ai-btn:active {
        transform: translateY(0);
    }

    /* AI Chat Floating Button */
    .ai-chat-fab {
        position: fixed;
        bottom: 30px;
        left: 30px;
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, #4361ee, #3a0ca3);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 999;
        box-shadow: 0 10px 25px rgba(67, 97, 238, 0.4);
        transition: all 0.3s ease;
        border: none;
        color: white;
        font-size: 1.5rem;
    }

    .ai-chat-fab:hover {
        transform: scale(1.1);
        box-shadow: 0 15px 35px rgba(67, 97, 238, 0.5);
    }

    .ai-chat-fab.active {
        display: none;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .ai-chat-modal {
            width: calc(100% - 40px);
            max-height: 70vh;
            bottom: 80px;
            left: 20px;
        }

        .message-content {
            max-width: 200px;
        }
    }

    /* RTL Support */
    [dir="rtl"] .ai-chat-modal {
        left: auto;
        right: 20px;
    }

    [dir="rtl"] .ai-message {
        flex-direction: row-reverse;
    }

    [dir="rtl"] .ai-chat-input-area {
        direction: rtl;
    }

    [dir="rtl"] .send-ai-btn {
        margin-right: 0;
        margin-left: 0.5rem;
    }

    [dir="rtl"] .ai-chat-fab {
        left: auto;
        right: 30px;
    }
</style>

<script>
    // AI Chat Modal Functionality
    (function () {
        const aiChatModal = document.getElementById("aiChatModal");
        const aiChatFab = document.getElementById("aiChatFab");
        const closeAiChat = document.getElementById("closeAiChat");
        const aiChatInput = document.getElementById("aiChatInput");
        const sendAiMessage = document.getElementById("sendAiMessage");
        const aiChatMessages = document.getElementById("aiChatMessages");

        // Toggle chat modal
        if (aiChatFab) {
            aiChatFab.addEventListener("click", () => {
                aiChatModal.classList.add("active");
                aiChatFab.classList.add("active");
                aiChatInput.focus();
            });
        }

        // Close chat modal
        if (closeAiChat) {
            closeAiChat.addEventListener("click", () => {
                aiChatModal.classList.remove("active");
                if (aiChatFab) aiChatFab.classList.remove("active");
            });
        }

        // Send message
        const sendMessage = async () => {
            const message = aiChatInput.value.trim();
            if (!message) return;

            // Add user message to chat
            addMessage(message, "user");
            aiChatInput.value = "";
            aiChatInput.style.height = "auto";

            // Show typing indicator
            const typingDiv = document.createElement("div");
            typingDiv.className = "ai-message";
            typingDiv.innerHTML =
                '<div class="message-avatar"><i class="fas fa-robot"></i></div><div class="message-content"><p>...</p></div>';
            aiChatMessages.appendChild(typingDiv);
            aiChatMessages.scrollTop = aiChatMessages.scrollHeight;

            try {
                // Call AI helper API
                const response = await fetch("/api/ai/helper", {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        message: message,
                        type: "general",
                    }),
                });

                const data = await response.json();
                typingDiv.remove();

                if (data.success) {
                    addMessage(data.response, "ai");
                } else {
                    addMessage(
                        "عذراً، حدث خطأ في الاتصال. حاول مرة أخرى.",
                        "ai",
                    );
                }
            } catch (error) {
                console.error("Error:", error);
                typingDiv.remove();
                addMessage("عذراً، حدث خطأ في الاتصال. حاول مرة أخرى.", "ai");
            }
        };

        if (sendAiMessage) {
            sendAiMessage.addEventListener("click", sendMessage);
        }

        if (aiChatInput) {
            aiChatInput.addEventListener("keypress", (e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Auto-resize textarea
            aiChatInput.addEventListener("input", () => {
                aiChatInput.style.height = "auto";
                aiChatInput.style.height =
                    Math.min(aiChatInput.scrollHeight, 100) + "px";
            });
        }

        // Add message to chat
        function addMessage(text, sender) {
            const messageDiv = document.createElement("div");
            messageDiv.className =
                sender === "user" ? "user-message" : "ai-message";

            const avatarDiv = document.createElement("div");
            avatarDiv.className = "message-avatar";
            avatarDiv.innerHTML =
                sender === "user"
                    ? '<i class="fas fa-user"></i>'
                    : '<i class="fas fa-robot"></i>';

            const contentDiv = document.createElement("div");
            contentDiv.className = "message-content";
            contentDiv.innerHTML = `<p>${escapeHtml(text)}</p>`;

            messageDiv.appendChild(avatarDiv);
            messageDiv.appendChild(contentDiv);
            aiChatMessages.appendChild(messageDiv);
            aiChatMessages.scrollTop = aiChatMessages.scrollHeight;
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const map = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;",
            };
            return text.replace(/[&<>"']/g, (m) => map[m]);
        }
    })();
</script>
